<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" type="image/jpeg" href="/assets/images/shecares-logo.jpg">
<script src="/js/splash.js"></script><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>History — SHECARES</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/><link href="/css/style.css" rel="stylesheet"/><style>.history-hero{background:linear-gradient(135deg,#fff7fa,#fce7f1);border-radius:28px;padding:28px}.history-card{background:#fff;border:1px solid #f7d8e6;border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(232,62,131,.07)}.history-icon{width:44px;height:44px;border-radius:13px;background:#fce7f1;color:#e83e83;display:flex;align-items:center;justify-content:center;flex:0 0 44px}.history-time{font-size:.82rem;color:#6b7280}.empty-history{padding:55px 20px;text-align:center;background:#fff;border:1px dashed #e9bfd2;border-radius:18px}.bottom-nav{display:none}@media(max-width:767px){.bottom-nav{display:flex;position:fixed;bottom:12px;left:12px;right:12px;z-index:100;background:#fff;border:1px solid #f3d4e1;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.12);justify-content:space-around;padding:9px}.bottom-nav a{font-size:11px;text-align:center;color:#6b7280;text-decoration:none}.bottom-nav i{display:block;font-size:17px;margin-bottom:2px}.bottom-nav .active{color:#e83e83}main{padding-bottom:90px}}</style><script src="/js/runtime-config.js"></script>
<script src="/js/api.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    if (window.SheCareAPI) {
      await SheCareAPI.me();
    }
  } catch (err) {
    if (err.status === 401 || !localStorage.getItem('sc_token')) {
      window.location.href = '/login.html';
    }
  }
});
</script>
</head>
<body><div class="petal-field"></div><nav class="navbar navbar-glass fixed-top py-3"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard.html"><span class="brand-badge">SH</span><span class="brand-name fs-5">SHECARES</span></a><div class="d-flex gap-2"><a class="btn btn-outline-pink d-none d-sm-inline-block" href="/dashboard.html"><i class="fa-solid fa-house me-1"></i>Dashboard</a><button class="btn btn-pink" id="logoutBtn" type="button">Logout</button></div></div></nav>
<main class="section" style="padding-top:105px"><div class="container"><section class="history-hero mb-4"><p class="eyebrow mb-1">SHECARES</p><h1 class="fw-bold mb-2">My History</h1><p class="text-ink-soft mb-0">Your SheCare activities and health actions, stored securely with the exact date and time.</p></section><div id="historyStatus" class="alert d-none" role="alert"></div><div id="historyList" class="d-grid gap-3"></div></div></main>
<div class="bottom-nav"><a href="/dashboard.html"><i class="fa-solid fa-house"></i>Home</a><a href="/reminders.html"><i class="fa-solid fa-heart-pulse"></i>Health</a><a href="/appointments.html"><i class="fa-solid fa-calendar"></i>Care</a><a class="active" href="/history.html"><i class="fa-solid fa-clock-rotate-left"></i>History</a><a href="/profile.html"><i class="fa-solid fa-user"></i>Profile</a></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
const iconFor=m=>({'Hospital Visit':'fa-hospital',Authentication:'fa-user-shield',Profile:'fa-user', 'Blood Pressure':'fa-heart-pulse','Blood Glucose':'fa-droplet',Period:'fa-calendar-days',Pregnancy:'fa-baby',Appointment:'fa-calendar-check',Reminder:'fa-bell',Medicine:'fa-pills',Mood:'fa-face-smile', 'Water Intake':'fa-glass-water',Fitness:'fa-person-running','Emergency Contact':'fa-address-book',SOS:'fa-triangle-exclamation',AI:'fa-robot',Smartwatch:'fa-stopwatch'})[m]||'fa-clock-rotate-left';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function formatDate(v){return new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'medium'}).format(new Date(v));}
function actionLabel(a){return ({VISIT_RECORDED:'Visited',CREATE:'Created',UPDATE:'Updated',DELETE:'Deleted',SAVE:'Saved',CHAT:'Used',LOGIN:'Login',SIGNUP:'Signup',SYNC:'Synced',WORKOUT:'Workout'})[a]||a;}
async function loadHistory(){const list=document.getElementById('historyList');try{const items=await SheCareAPI.history(250);if(!items.length){list.innerHTML='<div class="empty-history"><i class="fa-solid fa-clock-rotate-left fs-1 text-primary-pink mb-3"></i><h5 class="fw-bold">No history yet</h5><p class="text-ink-soft mb-0">Your activities will appear here automatically with date and time.</p></div>';return;}list.innerHTML=items.map(x=>`<article class="history-card"><div class="d-flex gap-3 align-items-start"><div class="history-icon"><i class="fa-solid ${iconFor(x.module)}"></i></div><div class="flex-grow-1"><div class="d-flex flex-wrap justify-content-between gap-2"><div><span class="badge rounded-pill text-bg-light border me-2">${esc(actionLabel(x.action))}</span><span class="fw-bold">${esc(x.module)}</span></div><span class="history-time"><i class="fa-regular fa-clock me-1"></i>${esc(formatDate(x.occurredAt))}</span></div><h6 class="fw-bold mt-2 mb-1">${esc(x.title)}</h6>${x.details?`<p class="text-ink-soft small mb-0">${esc(x.details)}</p>`:''}</div></div></article>`).join('');}catch(e){if(e.status===401){console.warn("Auth redirect suppressed");return;}document.getElementById('historyStatus').className='alert alert-danger';document.getElementById('historyStatus').textContent=e.message||'Could not load history.';}}
document.addEventListener('DOMContentLoaded',async()=>{try{await SheCareAPI.me();await loadHistory();document.getElementById('logoutBtn').onclick=async()=>{await SheCareAPI.logout();console.warn("Auth redirect suppressed");}}catch(err){ console.warn("Guest mode/API error:", err.message); }});
</script></body></html>
