<!DOCTYPE html>

<html lang="en"><head>
<link rel="icon" type="image/jpeg" href="assets/images/shecares-logo.jpg">
<script src="js/splash.js"></script><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Forgot Password — SHECARES</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/><link href="css/style.css" rel="stylesheet"/><style>.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{max-width:470px;width:100%;background:#fff;border:1px solid #f3d4e1;border-radius:24px;padding:34px;box-shadow:0 20px 50px rgba(232,62,131,.12)}.reset-icon{width:70px;height:70px;border-radius:20px;background:#fce7f1;color:#e83e83;display:grid;place-items:center;font-size:28px}</style><script src="/js/runtime-config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth-router.js"></script>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="SHECARES"/>
<meta name="theme-color" content="#e83e83"/>
<link rel="manifest" href="/manifest.json"/>
<script src="/js/pwa-install.js" defer></script>
</head><body><div class="petal-field"></div><div class="auth-wrap"><div class="auth-card"><a class="d-flex align-items-center gap-2 text-decoration-none mb-4" href="/index.html"><span class="brand-badge">SH</span><span class="brand-name">SHECARES</span></a><div class="reset-icon mb-3"><i class="fa-solid fa-key"></i></div><h1 class="fw-bold">Forgot Password</h1><p class="text-ink-soft">Enter your email address and we will send you a link to reset your password.</p><form id="resetForm"><label class="form-label-pink" for="resetEmail">Email Address</label><input class="form-control form-control-pink mb-3" id="resetEmail" placeholder="you@example.com" required="" type="email"/><button class="btn btn-pink w-100" id="resetBtn" type="submit">Send Reset Link</button></form><div class="alert d-none mt-3" id="resetMsg"></div><a class="btn btn-outline-pink w-100 mt-3" href="/login.html">Back to Login</a><p class="small text-ink-soft mt-3 mb-0">If the account exists, SheCare will send a reset link through the configured secure email service.</p></div></div><script>document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('resetBtn'),msg=document.getElementById('resetMsg');btn.disabled=true;msg.className='alert alert-info mt-3';msg.textContent='Sending reset request…';try{const r=await SheCareAPI.forgot(document.getElementById('resetEmail').value);msg.className='alert alert-success mt-3';msg.textContent=r.message||'If an account exists, a reset email will be sent.';}catch(err){msg.className='alert alert-danger mt-3';msg.textContent=err.message||'We could not send the reset request.';}finally{btn.disabled=false;}});</script></body></html>
