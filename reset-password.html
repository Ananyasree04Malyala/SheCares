<!doctype html><html lang="en"><head>

<script src="js/splash.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — SHECARES</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><script src="/js/runtime-config.js"></script>

</head><body><div class="auth-wrap" style="min-height:100vh;display:grid;place-items:center;padding:24px"><div class="auth-card" style="max-width:470px;width:100%;background:#fff;border:1px solid #f3d4e1;border-radius:24px;padding:34px"><a class="d-flex align-items-center gap-2 text-decoration-none mb-4" href="/index.html"><span class="brand-badge">SH</span><span class="brand-name">SHECARES</span></a><h1 class="fw-bold">Create a new password</h1><p class="text-ink-soft">Choose a strong password for your SheCare account.</p><form id="resetPasswordForm"><label class="form-label-pink" for="newPassword">New Password</label><input class="form-control form-control-pink mb-3" id="newPassword" minlength="8" required type="password"><label class="form-label-pink" for="confirmPassword">Confirm Password</label><input class="form-control form-control-pink mb-3" id="confirmPassword" minlength="8" required type="password"><button class="btn btn-pink w-100" id="resetSubmit" type="submit">Reset Password</button></form><div class="alert d-none mt-3" id="resetResult"></div><a class="btn btn-outline-pink w-100 mt-3" href="/login.html">Back to Login</a></div></div><script>document.getElementById('resetPasswordForm').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value,r=document.getElementById('resetResult'),b=document.getElementById('resetSubmit'),t=new URLSearchParams(location.search).get('token');if(p!==c){r.className='alert alert-danger mt-3';r.textContent='Passwords do not match.';return}if(!t){r.className='alert alert-danger mt-3';r.textContent='Reset token is missing.';return}b.disabled=true;try{const d=await SheCareAPI.reset(t,p);r.className='alert alert-success mt-3';r.textContent=d.message;setTimeout(()=>console.warn("Auth redirect suppressed"),1200)}catch(err){r.className='alert alert-danger mt-3';r.textContent=err.message}finally{b.disabled=false}});</script></body></html>
